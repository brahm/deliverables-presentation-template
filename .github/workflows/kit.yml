# Testa o próprio kit: instalador, checagens, hooks e skills.
# Este arquivo só serve ao repositório do template.
name: Kit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes do kit
        run: python3 tools/testar_kit.py
