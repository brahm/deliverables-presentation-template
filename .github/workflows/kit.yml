# Testa o próprio kit: instalador, checagens, hooks e skills.
# Este arquivo só serve ao repositório do template.
name: Kit

on:
  pull_request:
  push:
    branches: [main]

# O trabalho só lê o repositório.
permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Pacotes do gerador de arquivos
        run: python3 -m pip install python-pptx==1.0.2 python-docx==1.2.0 openpyxl==3.1.5
      - name: Testes do kit
        run: python3 tools/testar_kit.py
